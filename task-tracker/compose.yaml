services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: taskapp
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ru"
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo-task-password}
    volumes:
      - taskdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapp -d tasktracker"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/tasktracker
      DB_USER: taskapp
      DB_PASSWORD: ${DB_PASSWORD:-demo-task-password}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taskdata: {}
